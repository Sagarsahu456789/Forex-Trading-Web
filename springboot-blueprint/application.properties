spring.application.name=ForexAcademyManagementSystem
server.port=8080

# MySQL 8 Configuration (set credentials via environment variables)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:forex_academy_db}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security (inject JWT_SECRET via environment variable)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# File Uploads (stored outside public static directory)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.storage.upload-dir=${UPLOAD_DIR:./uploads}

# Razorpay Payment Verification (server-side only)
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
